<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="영산대학교 네팔 홍수 피해 구호 모금 계좌 안내">
  <title>네팔 홍수 피해 구호 모금 | 영산대학교</title>
  <style>
    :root {
      --navy: #17253f;
      --crimson: #7b1734;
      --ink: #151923;
      --muted: #626875;
      --line: #e2e4e8;
      --success: #17633a;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      line-height: 1.5;
      word-break: keep-all;
    }
    .topbar { height: 8px; background: var(--crimson); }
    main {
      width: min(100%, 560px);
      min-height: calc(100vh - 8px);
      margin: 0 auto;
      padding: 54px 22px 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      display: block;
      width: min(100%, 250px);
      height: auto;
      margin: 0 auto 52px;
    }
    header { width: 100%; text-align: center; }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(26px, 7vw, 38px);
      line-height: 1.2;
      letter-spacing: -.045em;
    }
    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }
    .account-box {
      width: 100%;
      margin-top: 42px;
      padding: 28px 20px 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      text-align: center;
    }
    .label {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .account-number {
      margin: 0;
      color: var(--navy);
      font-size: clamp(30px, 9vw, 44px);
      font-weight: 850;
      letter-spacing: -.045em;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .details {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .copy-button {
      width: 100%;
      min-height: 76px;
      margin-top: 25px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--crimson);
      font: inherit;
      font-size: 21px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(123, 23, 52, .18);
      transition: transform .12s ease, background .12s ease;
    }
    .copy-button:hover { background: #601026; }
    .copy-button:active { transform: translateY(1px); }
    .copy-button:focus-visible { outline: 3px solid rgba(23, 37, 63, .35); outline-offset: 4px; }
    .status {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--success);
      font-size: 14px;
      font-weight: 750;
    }
    footer {
      margin-top: auto;
      padding-top: 42px;
      color: #8a8e98;
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 370px) {
      main { padding-left: 16px; padding-right: 16px; }
      .account-box { padding-left: 14px; padding-right: 14px; }
      .account-number { font-size: 27px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="topbar" aria-hidden="true"></div>
  <main>
    <img class="logo" src="ysu-logo.png" alt="와이즈유 영산대학교 공식 로고">

    <header>
      <h1>네팔 홍수 피해 구호 모금</h1>
      <p class="subtitle">Nepal Flood Relief Fundraising</p>
    </header>

    <section class="account-box" aria-labelledby="account-label">
      <p id="account-label" class="label">기부 계좌 · DONATION ACCOUNT</p>
      <p class="account-number" id="accountNumber">909601-01-629487</p>
      <p class="details">KB국민은행 · 예금주: 영산대학교</p>
      <button class="copy-button" id="copyButton" type="button">계좌번호 복사</button>
      <p class="status" id="copyStatus" role="status" aria-live="polite"></p>
    </section>

    <footer>영산대학교</footer>
  </main>
  <script>
    const account = '909601-01-629487';
    const button = document.getElementById('copyButton');
    const status = document.getElementById('copyStatus');

    async function copyAccount() {
      try {
        await navigator.clipboard.writeText(account);
      } catch (_) {
        const field = document.createElement('textarea');
        field.value = account;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
      }
      button.textContent = '복사되었습니다';
      status.textContent = '은행 앱에 붙여 넣어 주세요.';
      window.setTimeout(() => {
        button.textContent = '계좌번호 복사';
        status.textContent = '';
      }, 2400);
    }
    button.addEventListener('click', copyAccount);
  </script>
</body>
</html>
